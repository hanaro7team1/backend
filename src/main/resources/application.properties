spring.application.name=backend
server.port=8082
# on dev
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
# everywhere
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.jdbc.batch_size=10
# MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3310/sidodb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=12345678
# swagger
springdoc.swagger-ui.path=/swagger.html
springdoc.api-docs.path=/v3/api-docs
# include application-secret.properties
spring.profiles.include=secret
#s3 upload
app.s3.bucket=sido-upload
app.s3.publicBaseUrl=https://sido-upload.s3.ap-northeast-2.amazonaws.com
app.aws.region=ap-northeast-2
aws.accessKey=${AWS_ACCESS_KEY_ID}
aws.secretKey=${AWS_SECRET_ACCESS_KEY}
#openAI api
openai.api.key=${OPENAI_API_KEY}
openai.api.url=https://api.openai.com/v1/responses